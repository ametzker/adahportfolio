<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PORTFOLIO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="name">Adah García</h1>
  </header>

  <main class="home" id="home">
    <a href="graphic.html" class="graphic-link">
      <span class="section-label">GRAPHIC</span>
      <img src="imatges/posters.png" alt="Posters de diseño gráfico">
    </a>

    <div class="bed" aria-label="Habitación">
      <img id="bed-image" src="imatges/llit-mati.png" alt="">
    
    <div class="lamp-wrap">
    <div class="lamp-glow"></div>
    <img id="lamp-image" class="lamp" src="imatges/llum.png" alt="">
  </div>
    </div>

    <a href="film.html" class="film-link">
      <img src="imatges/pc.png" alt="Ordenador Mac">
      <span class="section-label">FILM</span>
    </a>

<button id="radio-trigger" class="radio-trigger" aria-label="Abrir reproductor" aria-expanded="false">
  <img src="imatges/radio.png" alt="Radio">
</button>
    
<div id="music-player" class="music-player" hidden>
  <div class="player-bubble">

    
<div class="track-info">
  <div class="track-title-window">
    <div id="track-title" class="track-title">AMOR EN EL METRO</div>
  </div>
  <div id="track-artist" class="track-artist">Greta</div>
</div>


    
<div class="player-controls">
  <div class="volume-wrap">
    <button id="volume-icon" class="player-icon" aria-label="Volumen" aria-expanded="false">VOL</button>
    <div class="volume-popup" id="volume-popup" hidden>
      <input id="volume" class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.7" orient="vertical" aria-label="Volumen">
    </div>
  </div>

  <button id="previous-track" class="player-icon" aria-label="Canción anterior">|◀</button>
  <button id="play-pause" class="player-icon play-button" aria-label="Reproducir">▶</button>
  <button id="next-track" class="player-icon" aria-label="Canción siguiente">▶|</button>

  <button id="tracklist-toggle" class="player-icon tracklist-toggle" aria-label="Abrir tracklist" aria-expanded="false">
    <span class="tracklist-arrow">⌄</span>
  </button>
</div>

  </div>

  <div id="tracklist-panel" class="tracklist-panel" aria-hidden="true">
    <div class="tracklist-heading">
      <span>TRACKLIST</span>
      <span id="track-count">00 TRACKS</span>
    </div>
    <div id="tracklist-items" class="tracklist-items"></div>
  </div>

  <audio id="audio" preload="metadata"></audio>
</div>


  </main>

  <footer class="bottom">
    <a href="about.html">About</a>
  </footer>

  <script src="sketch.js"></script>
</body>
</html>
